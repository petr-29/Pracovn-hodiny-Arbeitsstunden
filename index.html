<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pracovní výkaz & Protokol</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        input, textarea, select { width: 100%; padding: 8px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .sig-container { display: flex; gap: 20px; margin-top: 20px; }
        canvas { border: 1px solid #000; width: 100%; height: 150px; background: #fff; }
        .btn { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; color: white; margin-top: 10px; }
        .btn-blue { background: #007bff; }
        .btn-green { background: #28a745; }
        .btn-red { background: #dc3545; }
    </style>
</head>
<body>

<div class="container" id="content">
    <h1>Výkaz práce</h1>
    <div class="grid">
        <input type="text" id="jmeno" placeholder="Jméno technika">
        <input type="text" id="firma" placeholder="Firma/Zákazník">
    </div>

    <h2>Záznamy</h2>
    <table id="hoursTable">
        <thead>
            <tr><th>Datum</th><th>Od</th><th>Do</th><th>Pauza</th><th>Projekt</th></tr>
        </thead>
        <tbody id="tableBody">
            <!-- Dynamicky generováno -->
        </tbody>
    </table>

    <div class="sig-container">
        <div style="flex:1">
            <label>Tvůj podpis:</label>
            <canvas id="sigUser"></canvas>
            <button class="btn btn-red" onclick="clearSig('sigUser')">Smazat</button>
        </div>
        <div style="flex:1">
            <label>Podpis zákazníka:</label>
            <canvas id="sigClient"></canvas>
            <button class="btn btn-red" onclick="clearSig('sigClient')">Smazat</button>
        </div>
    </div>

    <div style="margin-top:20px;">
        <button class="btn btn-blue" onclick="generatePDF('standard')">Standard PDF (Týden)</button>
        <button class="btn btn-green" onclick="generatePDF('abnahme')">Abnahme PDF</button>
    </div>
</div>

<script>
    // Inicializace canvasů
    function setupCanvas(id) {
        const canvas = document.getElementById(id);
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        let drawing = false;

        const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        canvas.addEventListener('mousedown', (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); });
        canvas.addEventListener('mousemove', (e) => { if (drawing) { ctx.lineTo(getPos(e).x, getPos(e).y); ctx.stroke(); } });
        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('touchstart', (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).touches[0].clientX - canvas.getBoundingClientRect().left, e.touches[0].clientY - canvas.getBoundingClientRect().top); });
        canvas.addEventListener('touchmove', (e) => { if (drawing) { ctx.lineTo(e.touches[0].clientX - canvas.getBoundingClientRect().left, e.touches[0].clientY - canvas.getBoundingClientRect().top); ctx.stroke(); } });
    }

    setupCanvas('sigUser');
    setupCanvas('sigClient');

    function clearSig(id) {
        const c = document.getElementById(id);
        c.getContext('2d').clearRect(0, 0, c.width, c.height);
    }

    // Generování řádků pro PDF
    function getWeekRows() {
        let rows = '';
        const today = new Date();
        const firstDayOfWeek = new Date(today.setDate(today.getDate() - today.getDay() + 1)); // Pondělí

        for (let i = 0; i < 7; i++) {
            let d = new Date(firstDayOfWeek);
            d.setDate(d.getDate() + i);
            let dateStr = d.toLocaleDateString('cs-CZ');
            rows += `<tr><td>${dateStr}</td><td></td><td></td><td></td><td></td></tr>`;
        }
        return rows;
    }

    function generatePDF(type) {
        const sigUser = document.getElementById('sigUser').toDataURL();
        const sigClient = document.getElementById('sigClient').toDataURL();
        
        let content = `
            <h1>${type === 'abnahme' ? 'Abnahme Protokoll' : 'Týdenní výkaz'}</h1>
            <p>Technik: ${document.getElementById('jmeno').value}</p>
            <p>Zákazník: ${document.getElementById('firma').value}</p>
            <table border="1" style="width:100%; border-collapse:collapse;">
                <thead><tr><th>Datum</th><th>Od</th><th>Do</th><th>Pauza</th><th>Projekt</th></tr></thead>
                <tbody>${getWeekRows()}</tbody>
            </table>
            <div style="display:flex; justify-content:space-between; margin-top:50px;">
                <div><p>Podpis technika:</p><img src="${sigUser}" width="200" height="100"></div>
                <div><p>Podpis zákazníka:</p><img src="${sigClient}" width="200" height="100"></div>
            </div>
        `;

        html2pdf().from(content).save(type + '_dokument.pdf');
    }
</script>

</body>
</html>
