<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pracovní hodiny & Protokol o převzetí</title>
    <style>
        :root {
            --primary: #0066cc;
            --primary-hover: #0052a3;
            --background: #f4f6f9;
            --text: #333;
            --border: #ccc;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 800px;
            width: 100%;
        }

        h1, h2 {
            color: #111;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        input[type="text"], input[type="date"], input[type="time"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
            background-color: #fff;
        }

        /* Úprava pro uzamčená pole (Režim šéf) */
        input:disabled, textarea:disabled {
            background-color: #e9ecef;
            color: #495057;
            border-color: #ced4da;
            cursor: not-allowed;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f8f9fa;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-item input {
            width: 18px;
            height: 18px;
        }

        .signature-section {
            margin-top: 30px;
            border-top: 2px dashed var(--border);
            padding-top: 20px;
        }

        .canvas-container {
            border: 2px solid #999;
            background: #fff;
            border-radius: 4px;
            position: relative;
            margin-bottom: 10px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 200px;
            touch-action: none;
        }

        .btn-clear {
            background: #6c757d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            flex: 1;
            min-width: 200px;
            text-align: center;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: #28a745; color: white; }
        .btn-success:hover { background-color: #218838; }
        .btn-boss { background-color: #ff9800; color: white; display: none; }
        .btn-boss:hover { background-color: #e68a00; }

        .alert {
            padding: 15px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
            font-weight: bold;
            text-align: center;
        }
        
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="container">
    <div id="statusAlert" class="alert"></div>

    <h1>Protokol o převzetí / Abnahmeprotokoll</h1>
    
    <div class="grid-2">
        <div class="form-group">
            <label>Jméno technika / Name des Technikers</label>
            <input type="text" id="jmeno" value="Petr Michálek">
        </div>
        <div class="form-group">
            <label>Zákazník (Firma) / Kunde (Firma)</label>
            <input type="text" id="firma" value="Netzsch, Sedanstrasse 70 D – 95100 Selb">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Ulice a č.p. / Straße u. Hs.-Nr.</label>
            <input type="text" id="adresa" value="Goethestraße 3">
        </div>
        <div class="form-group">
            <label>PSČ a Město / PLZ u. Ort</label>
            <input type="text" id="mesto" value="94577 Winzer">
        </div>
    </div>

    <h2>Odpracované hodiny / Arbeitsstunden</h2>
    <table id="hoursTable">
        <thead>
            <tr>
                <th>Datum</th>
                <th>Od / Von</th>
                <th>Do / Bis</th>
                <th>Pauza / Pause</th>
                <th>Projekt / Zakázka</th>
            </tr>
        </thead>
        <tbody>
            <tr data-id="1779021498815">
                <td><input type="text" class="row-date" value="16. 5. 2026"></td>
                <td><input type="time" class="row-start" value="07:30"></td>
                <td><input type="time" class="row-end" value="17:00"></td>
                <td><input type="text" class="row-pause" value="30"></td>
                <td><input type="text" class="row-project" value="Netzsch, Sedanstrasse 70 D – 95100 Selb"></td>
            </tr>
        </tbody>
    </table>

    <div class="checkbox-group">
        <div class="checkbox-item">
            <input type="checkbox" id="bezZkousky" class="boss-lock">
            <label for="bezZkousky">Bez zkoušky funkčnosti / Ohne Funktionprüfung</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="seZkouskou" class="boss-lock" checked>
            <label for="seZkouskou">Se zkouškou funkčnosti / Mit Funktionprüfung</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="sVadami" class="boss-lock">
            <label for="sVadami">S vadami (viz text níže) / Mit Mängeln</label>
        </div>
    </div>

    <div class="form-group">
        <label>Zjištěné vady / Festgestellte Mängel</label>
        <textarea id="vadyText" rows="3"></textarea>
    </div>

    <div class="form-group">
        <label>Odstranění vad do / Mängelbeseitigung bis</label>
        <input type="text" id="odstraneniDo">
    </div>

    <div class="signature-section">
        <h2>Podpis zákazníka / Unterschrift des Kunden</h2>
        <div class="canvas-container">
            <canvas id="signatureCanvas"></canvas>
        </div>
        <button type="button" id="btnClearSignature" class="btn-clear" onclick="clearCanvas()">Vymazat podpis / Löschen</button>
    </div>

    <div class="actions" id="actionButtons">
        <button class="btn btn-primary" id="btnGenerate" onclick="generateShareLink(true)">Odeslat k podpisu (Šéf)</button>
        <button class="btn btn-success" id="btnPdf" onclick="saveAsPDF()">Uložit jako PDF</button>
        <button class="btn btn-boss" id="btnBossConfirm" onclick="bossConfirm()">Potvrdit, uložit a odeslat technikovi</button>
    </div>
</div>

<script>
    // Inicializace kreslení na canvasu
    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let globalAppData = {}; // Pro uchování dat při přeposílání

    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        ctx.scale(ratio, ratio);
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000';
    }

    window.addEventListener('resize', resizeCanvas);
    document.addEventListener('DOMContentLoaded', () => {
        resizeCanvas();
        checkUrlParams(); 
    });

    // Podpora pro myš i dotyk
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function stopDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('touchstart', startDraw, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', stopDraw);

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Vygenerování odkazu s daty
    function generateShareLink(forBoss = false) {
        const rows = [];
        document.querySelectorAll('#hoursTable tbody tr').forEach(tr => {
            rows.push({
                id: tr.dataset.id ? parseInt(tr.dataset.id) : Date.now(),
                datum: tr.querySelector('.row-date').value,
                zacatek: tr.querySelector('.row-start').value,
                konec: tr.querySelector('.row-end').value,
                prestashka: tr.querySelector('.row-pause').value,
                projekt: tr.querySelector('.row-project').value
            });
        });

        const appData = {
            isBossMode: forBoss,
            isSignedReturned: false,
            jmeno: document.getElementById('jmeno').value,
            firma: document.getElementById('firma').value,
            adresa: document.getElementById('adresa').value,
            mesto: document.getElementById('mesto').value,
            bezZkousky: document.getElementById('bezZkousky').checked,
            seZkouskou: document.getElementById('seZkouskou').checked,
            sVadami: document.getElementById('sVadami').checked,
            vadyText: document.getElementById('vadyText').value,
            odstraneniDo: document.getElementById('odstraneniDo').value,
            zaznamy: rows,
            signatureImage: forBoss ? null : canvas.toDataURL('image/jpeg', 0.5) // Komprimovaný podpis
        };

        try {
            const jsonString = JSON.stringify(appData);
            const base64Encoded = btoa(unescape(encodeURIComponent(jsonString)));
            const baseUrl = window.location.origin + window.location.pathname;
            const finalLink = `${baseUrl}?sign=${base64Encoded}`;

            if (forBoss) {
                navigator.clipboard.writeText(finalLink).then(() => {
                    alert('Odkaz pro šéfa zkopírován! Vlož mu ho do WhatsAppu.\nŠéf uvidí jen zamčený formulář k podpisu.');
                }).catch(() => {
                    alert('Zkopíruj tento odkaz pro šéfa:\n\n' + finalLink);
                });
            } else {
                return finalLink; // Používá se interně pro návrat technika
            }
        } catch (err) {
            alert('Chyba při generování odkazu: ' + err.message);
        }
    }

    // Šéf kliknul na potvrdit
    function bossConfirm() {
        // 1. Zkontrolujeme jestli je podepsáno (zjednodušeně)
        const blank = document.createElement('canvas');
        blank.width = canvas.width;
        blank.height = canvas.height;
        if (canvas.toDataURL() === blank.toDataURL()) {
            alert("Prosím, přidejte podpis před potvrzením.");
            return;
        }

        // 2. Stáhneme PDF šéfovi
        saveAsPDF();

        // 3. Vygenerujeme zpětný odkaz pro tebe s vloženým podpisem
        globalAppData.isBossMode = false;
        globalAppData.isSignedReturned = true;
        globalAppData.signatureImage = canvas.toDataURL('image/jpeg', 0.6); // Uložíme obrázek podpisu

        const jsonString = JSON.stringify(globalAppData);
        const base64Encoded = btoa(unescape(encodeURIComponent(jsonString)));
        const baseUrl = window.location.origin + window.location.pathname;
        const returnLink = `${baseUrl}?sign=${base64Encoded}`;

        // 4. Otevřeme WhatsApp pro odeslání technikovi zpět
        const waMessage = encodeURIComponent(`Hotovo, podepsal jsem to! Zde je potvrzení: ${returnLink}`);
        window.location.href = `whatsapp://send?text=${waMessage}`;
    }

    function checkUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const signParam = urlParams.get('sign');

        if (!signParam) return;

        try {
            const decodedJson = decodeURIComponent(escape(atob(signParam)));
            const data = JSON.parse(decodedJson);
            globalAppData = data; // Uložíme do globální proměnné

            // Vyplnění polí
            if (data.jmeno) document.getElementById('jmeno').value = data.jmeno;
            if (data.firma) document.getElementById('firma').value = data.firma;
            if (data.adresa) document.getElementById('adresa').value = data.adresa;
            if (data.mesto) document.getElementById('mesto').value = data.mesto;
            if (data.vadyText) document.getElementById('vadyText').value = data.vadyText;
            if (data.odstraneniDo) document.getElementById('odstraneniDo').value = data.odstraneniDo;
            
            document.getElementById('bezZkousky').checked = !!data.bezZkousky;
            document.getElementById('seZkouskou').checked = !!data.seZkouskou;
            document.getElementById('sVadami').checked = !!data.sVadami;

            const tbody = document.querySelector('#hoursTable tbody');
            tbody.innerHTML = '';

            if (data.zaznamy && Array.isArray(data.zaznamy)) {
                data.zaznamy.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.dataset.id = item.id;
                    tr.innerHTML = `
                        <td><input type="text" class="row-date" value="${item.datum || ''}"></td>
                        <td><input type="time" class="row-start" value="${item.zacatek || ''}"></td>
                        <td><input type="time" class="row-end" value="${item.konec || ''}"></td>
                        <td><input type="text" class="row-pause" value="${item.prestashka || '0'}"></td>
                        <td><input type="text" class="row-project" value="${item.projekt || ''}"></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            const alertBox = document.getElementById('statusAlert');

            // Pokud jsme ve ŠÉF MÓDU (Zamknout pole)
            if (data.isBossMode) {
                const inputs = document.querySelectorAll('input, textarea');
                inputs.forEach(input => input.disabled = true);
                
                // Povolit canvas a tlačítko vymazat
                canvas.style.pointerEvents = 'auto';

                // Přepnout tlačítka
                document.getElementById('btnGenerate').style.display = 'none';
                document.getElementById('btnPdf').style.display = 'none';
                document.getElementById('btnBossConfirm').style.display = 'block';

                alertBox.innerText = 'Režim podpisu: Prosím zkontrolujte údaje, podepište se a klikněte na Potvrdit.';
                alertBox.style.display = 'block';
                alertBox.style.backgroundColor = '#fff3cd';
                alertBox.style.color = '#856404';
                alertBox.style.borderColor = '#ffeeba';
            }

            // Pokud se to VRÁTILO TECHNIKOVI podepsané
            if (data.isSignedReturned) {
                alertBox.innerText = '✅ UPOZORNĚNÍ: Protokol byl úspěšně podepsán šéfem!';
                alertBox.style.display = 'block';

                // Vykreslení podpisu zpět do plátna
                if (data.signatureImage) {
                    const img = new Image();
                    img.onload = function() {
                        ctx.drawImage(img, 0, 0);
                    };
                    img.src = data.signatureImage;
                    
                    // Zamkneme podpis proti přepsání
                    document.getElementById('btnClearSignature').style.display = 'none';
                    canvas.style.pointerEvents = 'none';
                }
            }

        } catch (error) {
            console.error(error);
            const alertBox = document.getElementById('statusAlert');
            alertBox.innerText = 'Chyba načítání. Data jsou poškozená.';
            alertBox.classList.add('alert-error');
            alertBox.style.display = 'block';
        }
    }

    function saveAsPDF() {
        const element = document.querySelector('.container');
        // Dočasně schováme tlačítka pro tisk
        const actions = document.getElementById('actionButtons');
        actions.style.display = 'none';

        const opt = {
            margin:       10,
            filename:     'Protokol_Abnahme.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            actions.style.display = 'flex'; // Vrátíme tlačítka zpět
        });
    }
</script>

</body>
</html>
