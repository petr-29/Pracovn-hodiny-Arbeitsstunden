<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pracovní hodiny & Protokol o převzetí</title>
    <style>
        :root {
            --primary: #0066cc;
            --primary-hover: #0052a3;
            --background: #f4f6f9;
            --text: #333;
            --border: #ccc;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 800px;
            width: 100%;
        }

        h1, h2 { color: #111; margin-top: 0; }

        .form-group { margin-bottom: 15px; }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #555;
        }

        input[type="text"], input[type="date"], input[type="time"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        /* --- STYLY PRO REŽIM ŠÉFA (Čtení) --- */
        .boss-mode input[type="text"], 
        .boss-mode input[type="date"], 
        .boss-mode input[type="time"], 
        .boss-mode textarea {
            border: none;
            background: transparent;
            padding: 5px 0;
            font-weight: bold;
            color: #000;
            pointer-events: none;
            resize: none;
        }
        
        .boss-mode input[type="checkbox"] {
            pointer-events: none;
        }
        /* ---------------------------------- */

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 10px;
            text-align: left;
        }

        th { background-color: #f8f9fa; }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-item input {
            width: 18px;
            height: 18px;
        }

        .signature-section {
            margin-top: 30px;
            border-top: 2px dashed var(--border);
            padding-top: 20px;
        }

        .canvas-container {
            border: 2px solid #999;
            background: #fff;
            border-radius: 4px;
            position: relative;
            margin-bottom: 10px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 200px;
            touch-action: none;
        }

        .btn-clear {
            background: #6c757d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
        }

        .actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            flex: 1;
            min-width: 200px;
            text-align: center;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: #28a745; color: white; }
        .btn-success:hover { background-color: #218838; }

        .alert {
            padding: 15px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="container" id="mainContainer">
    <div id="errorAlert" class="alert"></div>

    <h1>Protokol o převzetí / Abnahmeprotokoll</h1>
    
    <div class="grid-2">
        <div class="form-group">
            <label>Jméno technika / Name des Technikers</label>
            <input type="text" id="jmeno" value="Petr Michálek">
        </div>
        <div class="form-group">
            <label>Zákazník (Firma) / Kunde (Firma)</label>
            <input type="text" id="firma" value="Netzsch, Sedanstrasse 70 D – 95100 Selb">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Ulice a č.p. / Straße u. Hs.-Nr.</label>
            <input type="text" id="adresa" value="Goethestraße 3">
        </div>
        <div class="form-group">
            <label>PSČ a Město / PLZ u. Ort</label>
            <input type="text" id="mesto" value="94577 Winzer">
        </div>
    </div>

    <h2>Odpracované hodiny / Arbeitsstunden</h2>
    <table id="hoursTable">
        <thead>
            <tr>
                <th>Datum</th>
                <th>Od / Von</th>
                <th>Do / Bis</th>
                <th>Pauza / Pause</th>
                <th>Projekt / Zakázka</th>
            </tr>
        </thead>
        <tbody>
            <tr data-id="1779021498815">
                <td><input type="text" class="row-date" value="16. 5. 2026"></td>
                <td><input type="time" class="row-start" value="07:30"></td>
                <td><input type="time" class="row-end" value="17:00"></td>
                <td><input type="text" class="row-pause" value="30"></td>
                <td><input type="text" class="row-project" value="Netzsch, Sedanstrasse 70 D – 95100 Selb"></td>
            </tr>
        </tbody>
    </table>

    <div class="checkbox-group">
        <div class="checkbox-item">
            <input type="checkbox" id="bezZkousky">
            <label for="bezZkousky">Bez zkoušky funkčnosti / Ohne Funktionprüfung</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="seZkouskou" checked>
            <label for="seZkouskou">Se zkouškou funkčnosti / Mit Funktionprüfung</label>
        </div>
        <div class="checkbox-item">
            <input type="checkbox" id="sVadami">
            <label for="sVadami">S vadami (viz text níže) / Mit Mängeln</label>
        </div>
    </div>

    <div class="form-group">
        <label>Zjištěné vady / Festgestellte Mängel</label>
        <textarea id="vadyText" rows="3"></textarea>
    </div>

    <div class="form-group">
        <label>Odstranění vad do / Mängelbeseitigung bis</label>
        <input type="text" id="odstraneniDo">
    </div>

    <div class="signature-section">
        <h2>Podpis zákazníka / Unterschrift des Kunden</h2>
        <div class="canvas-container">
            <canvas id="signatureCanvas"></canvas>
        </div>
        <button type="button" class="btn-clear" id="btnClearSignature" onclick="clearCanvas()">Vymazat podpis / Löschen</button>
    </div>

    <div class="actions" id="petrActions">
        <button class="btn btn-primary" onclick="generateBossLink()">Vygenerovat odkaz pro podpis</button>
    </div>

    <div class="actions" id="bossActions" style="display: none;">
        <button class="btn btn-success" onclick="saveAsPDF()">Stáhnout PDF</button>
        <button class="btn btn-primary" onclick="confirmSignature()">Potvrdit podepsání</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('signatureCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        ctx.scale(ratio, ratio);
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000';
    }

    window.addEventListener('resize', resizeCanvas);
    document.addEventListener('DOMContentLoaded', () => {
        resizeCanvas();
        checkUrlParams();
    });

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }

    function stopDraw() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDraw);

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // --- GENEROVÁNÍ ODKAZU PRO ŠÉFA ---
    function generateBossLink() {
        const rows = [];
        document.querySelectorAll('#hoursTable tbody tr').forEach(tr => {
            rows.push({
                datum: tr.querySelector('.row-date').value,
                zacatek: tr.querySelector('.row-start').value,
                konec: tr.querySelector('.row-end').value,
                prestavka: tr.querySelector('.row-pause').value,
                projekt: tr.querySelector('.row-project').value
            });
        });

        const appData = {
            jmeno: document.getElementById('jmeno').value,
            firma: document.getElementById('firma').value,
            adresa: document.getElementById('adresa').value,
            mesto: document.getElementById('mesto').value,
            bezZkousky: document.getElementById('bezZkousky').checked,
            seZkouskou: document.getElementById('seZkouskou').checked,
            sVadami: document.getElementById('sVadami').checked,
            vadyText: document.getElementById('vadyText').value,
            odstraneniDo: document.getElementById('odstraneniDo').value,
            zaznamy: rows
        };

        try {
            const jsonString = JSON.stringify(appData);
            const base64Encoded = btoa(unescape(encodeURIComponent(jsonString)));
            
            // Přidáme parametr &boss=1, aby se stránka rovnou zamkla
            const baseUrl = window.location.origin + window.location.pathname;
            const finalLink = `${baseUrl}?sign=${base64Encoded}&boss=1`;

            navigator.clipboard.writeText(finalLink).then(() => {
                alert('Odkaz pro šéfa zkopírován do schránky!');
            }).catch(() => {
                alert('Zkopíruj tento odkaz:\n\n' + finalLink);
            });
        } catch (err) {
            alert('Chyba při generování odkazu: ' + err.message);
        }
    }

    // --- NAČÍTÁNÍ ODKAZU A UZAMČENÍ PRO ŠÉFA ---
    function checkUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const signParam = urlParams.get('sign');
        const isBoss = urlParams.get('boss') === '1';

        if (signParam) {
            try {
                const decodedJson = decodeURIComponent(escape(atob(signParam)));
                const data = JSON.parse(decodedJson);

                if (data.jmeno) document.getElementById('jmeno').value = data.jmeno;
                if (data.firma) document.getElementById('firma').value = data.firma;
                if (data.adresa) document.getElementById('adresa').value = data.adresa;
                if (data.mesto) document.getElementById('mesto').value = data.mesto;
                if (data.vadyText) document.getElementById('vadyText').value = data.vadyText;
                if (data.odstraneniDo) document.getElementById('odstraneniDo').value = data.odstraneniDo;
                
                document.getElementById('bezZkousky').checked = !!data.bezZkousky;
                document.getElementById('seZkouskou').checked = !!data.seZkouskou;
                document.getElementById('sVadami').checked = !!data.sVadami;

                const tbody = document.querySelector('#hoursTable tbody');
                tbody.innerHTML = '';

                if (data.zaznamy && Array.isArray(data.zaznamy)) {
                    data.zaznamy.forEach(item => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><input type="text" class="row-date" value="${item.datum || ''}"></td>
                            <td><input type="time" class="row-start" value="${item.zacatek || ''}"></td>
                            <td><input type="time" class="row-end" value="${item.konec || ''}"></td>
                            <td><input type="text" class="row-pause" value="${item.prestavka || '0'}"></td>
                            <td><input type="text" class="row-project" value="${item.projekt || ''}"></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error(error);
                document.getElementById('errorAlert').innerText = 'Chyba načítání dat.';
                document.getElementById('errorAlert').style.display = 'block';
            }
        }

        // Pokud je to šéf, uzamkneme formulář
        if (isBoss) {
            document.getElementById('mainContainer').classList.add('boss-mode');
            document.getElementById('petrActions').style.display = 'none';
            document.getElementById('bossActions').style.display = 'flex';
        }
    }

    // --- POTVRZENÍ A ODESLÁNÍ DO APLIKACE VOLTAPLAN ---
    function confirmSignature() {
        // Tady můžeme vytáhnout base64 obrázek podpisu, kdybys ho chtěl poslat do appky
        // const signatureData = canvas.toDataURL('image/png');
        
        // Změň toto URL schéma podle toho, jak si ho ve SwiftUI nastavíš
        const appScheme = "voltaplan://signature_complete?status=success";
        
        // Spustí přesměrování (v iOS otevře aplikaci)
        window.location.href = appScheme;
        
        // Pojistka pro prohlížeč
        setTimeout(() => {
            alert("Podepsáno! Nyní se můžeš vrátit do aplikace.");
        }, 500);
    }

    function saveAsPDF() {
        // Skryjeme mazací tlačítko a akci před tiskem
        document.getElementById('btnClearSignature').style.display = 'none';
        document.getElementById('bossActions').style.display = 'none';
        
        const element = document.querySelector('.container');
        const opt = {
            margin:       10,
            filename:     'Protokol_Abnahme.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        
        html2pdf().set(opt).from(element).save().then(() => {
            // Vrátíme tlačítka zpět
            document.getElementById('btnClearSignature').style.display = 'block';
            document.getElementById('bossActions').style.display = 'flex';
        });
    }
</script>

</body>
</html>
