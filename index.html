<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stundenzettel - ELEKTRO MICHÁLEK</title>

    <!-- PDF Knihovny (jsPDF + autoTable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg-main: #050505;
            --bg-container: #0f0f12;
            --bg-card: #18181c;
            --bg-card-sub: #202025;
            --primary-orange: #ff9500;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-visible: #2f2f36; /* Jasně viditelné ohraničení pro tmavý režim */
            --border-highlight: #ff9500;
            --radius-large: 16px;
            --radius-medium: 12px;
            --radius-small: 8px;
            --danger: #ef4444;
            --info: #3b82f6;
            --success: #22c55e;
            --hierarchy-base: 4px;
            --hierarchy-expanded: 12px; /* Zvětšení půlměsíce při rozbalení o ~4mm */
        }

        [data-theme="light"] {
            --bg-main: #e4e4e7;
            --bg-container: #ffffff;
            --bg-card: #f4f4f5;
            --bg-card-sub: #e4e4e7;
            --primary-orange: #f97316;
            --text-main: #18181b;
            --text-muted: #71717a;
            --border-visible: #d4d4d8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            min-height: 100vh;
            padding: 20px 10px;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Hlavní kontejner aplikace s viditelným okrajem */
        .app-wrapper {
            max-width: 520px;
            margin: 0 auto;
            background-color: var(--bg-container);
            border: 1px solid var(--border-visible);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .top-nav {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        .icon-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-visible);
            color: var(--text-main);
            width: 38px; height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            margin-left: 8px;
        }

        /* Píchačky */
        .pichacky-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-visible);
            border-radius: var(--radius-large);
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .summary-title { color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
        .stopwatch-display { font-size: 42px; font-weight: 800; color: var(--primary-orange); margin: 8px 0; font-family: monospace; }

        /* PDF Tlačítka */
        .pdf-actions { display: flex; gap: 8px; margin-bottom: 20px; }
        .btn-pdf {
            flex: 1; padding: 12px 8px; border-radius: var(--radius-medium);
            font-weight: 700; font-size: 13px; border: 1px solid var(--border-visible);
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
            color: #000; transition: transform 0.1s;
        }
        .btn-pdf:active { transform: scale(0.98); }
        .btn-pdf-blue { background-color: #60a5fa; }
        .btn-pdf-orange { background-color: var(--primary-orange); }
        .btn-pdf-red { background-color: #f87171; }

        /* Karty s animovaným půlměsícem */
        .card { 
            background-color: var(--bg-card); 
            border: 1px solid var(--border-visible); 
            border-radius: var(--radius-large); 
            padding: 16px; 
            margin-bottom: 12px; 
        }
        
        .month-card {
            border-left: var(--hierarchy-base) solid var(--primary-orange);
            cursor: pointer;
            transition: border-left-width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        /* Zvětšení půlměsíce/lišty po kliknutí */
        .month-card.open { border-left-width: var(--hierarchy-expanded); }

        .week-card {
            background-color: var(--bg-card-sub);
            border: 1px solid var(--border-visible);
            border-left: var(--hierarchy-base) solid var(--primary-orange);
            cursor: pointer;
            transition: border-left-width 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 10px;
        }
        .week-card.open { border-left-width: var(--hierarchy-expanded); }

        .month-content, .week-content { margin-top: 12px; padding-left: 8px; border-left: 1px solid var(--border-visible); }

        /* Záznam dnu */
        .record-item {
            background-color: var(--bg-container);
            border: 1px solid var(--border-visible);
            display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 12px; border-radius: var(--radius-medium);
        }
        .custom-checkbox {
            width: 22px; height: 22px; background-color: var(--bg-card); border: 2px solid var(--primary-orange);
            border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .custom-checkbox.checked::after { content: '✓'; color: var(--primary-orange); font-weight: bold; font-size: 14px; }

        .record-hours { color: var(--primary-orange); font-weight: 700; font-size: 14px; }
        .btn-danger { background-color: var(--danger); color: #fff; padding: 5px 10px; font-size: 11px; border-radius: 16px; border: none; cursor: pointer; font-weight: 600; }
        .btn-blue-small { background-color: var(--info); color: #fff; padding: 5px 10px; font-size: 11px; border-radius: 16px; border: none; cursor: pointer; font-weight: 600; }
        
        .btn-main {
            background-color: var(--primary-orange); color: #000; border: none;
            border-radius: var(--radius-large); padding: 14px; font-size: 15px; font-weight: 700;
            cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-outline { background-color: transparent; color: var(--text-main); border: 1px solid var(--border-visible); margin-top: 15px; }

        /* Modál */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: center;
            padding: 15px; z-index: 100; opacity: 0; pointer-events: none; transition: 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background-color: var(--bg-card); width: 100%; max-width: 440px;
            border-radius: var(--radius-large); padding: 20px; border: 1px solid var(--border-visible);
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="top-nav">
            <button class="icon-btn" onclick="toggleTheme()" title="Přepnout režim">🌓</button>
            <button class="icon-btn" onclick="alert('Nastavení firmy')" title="Nastavení">⚙️</button>
        </div>

        <!-- Píchačky -->
        <div class="pichacky-card">
            <div class="summary-title">RYCHLÉ PÍCHAČKY</div>
            <div class="stopwatch-display">00:00:00</div>
            <button class="btn-main" style="background-color: var(--success);">
                🟢 Zahájit práci (Příchod)
            </button>
        </div>

        <div class="summary-title" style="margin-bottom: 8px;">VYGENEROVAT PDF Z OZNAČENÝCH DNŮ:</div>
        <div class="pdf-actions">
            <button class="btn-pdf btn-pdf-blue" onclick="generatePDF('standard')">📄 Standard PDF</button>
            <button class="btn-pdf btn-pdf-orange" onclick="generatePDF('abnahme')">📋 Abnahme PDF</button>
            <button class="btn-pdf btn-pdf-red" onclick="generatePDF('faktura')">🧾 Faktura PDF</button>
        </div>

        <!-- Strom zápisů -->
        <div id="tree-container"></div>

        <button class="btn-main btn-outline" onclick="openModal()">+ Zapsat hodiny ručně</button>
    </div>

    <script>
        let zaznamy = [
            { id: 1, datum: '2026-09-01', od: '07:00', do: '16:00', pauzaOd: '12:00', pauzaDo: '12:30', hodiny: 8.5, popis: 'Elektroinstalace, zapojení', sazba: 25 },
            { id: 2, datum: '2026-09-02', od: '07:00', do: '16:00', pauzaOd: '12:00', pauzaDo: '12:30', hodiny: 8.5, popis: 'Tahání kabelů', sazba: 25 }
        ];
        let selectedIds = [1, 2];
        let openMonths = { '2026-8': true };
        let openWeeks = { '2026-8-W36': true };

        function toggleTheme() {
            const html = document.documentElement;
            html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        function toggleMonth(key) {
            openMonths[key] = !openMonths[key];
            render();
        }

        function toggleWeek(key, e) {
            e.stopPropagation();
            openWeeks[key] = !openWeeks[key];
            render();
        }

        function toggleCheck(id, e) {
            e.stopPropagation();
            if(selectedIds.includes(id)) selectedIds = selectedIds.filter(i => i !== id);
            else selectedIds.push(id);
            render();
        }

        function render() {
            const container = document.getElementById('tree-container');
            container.innerHTML = '';

            // Měsíc Září 2026
            let mOpen = openMonths['2026-8'];
            let wOpen = openWeeks['2026-8-W36'];

            let html = `
            <div class="card month-card ${mOpen ? 'open' : ''}" onclick="toggleMonth('2026-8')">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div class="summary-title">MĚSÍČNÍ SOUHRN ${mOpen ? '▼' : '▶'}</div>
                        <div style="font-weight:700; font-size:16px;">📅 Září 2026</div>
                    </div>
                    <div style="text-align:right;">
                        <div style="color:var(--primary-orange); font-weight:800; font-size:15px;">425.00 €</div>
                        <div style="color:var(--text-muted); font-size:12px;">17.00 h celkem</div>
                    </div>
                </div>`;

            if(mOpen) {
                html += `<div class="month-content">
                    <div class="card week-card ${wOpen ? 'open' : ''}" onclick="toggleWeek('2026-8-W36', event)">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <div class="summary-title" style="color:var(--primary-orange);">▼ PODROBNOSTI TÝDNE</div>
                                <div style="font-weight:700; font-size:14px;">📌 36. týden</div>
                            </div>
                            <div style="text-align:right;">
                                <div style="color:var(--primary-orange); font-weight:700;">425.00 €</div>
                                <div style="color:var(--text-muted); font-size:12px;">17.00 h</div>
                            </div>
                        </div>`;

                if(wOpen) {
                    html += `<div class="week-content">
                        <div class="summary-title" style="margin-top:10px;">ULOŽENÉ VÝKAZY V TÝDNU:</div>
                        <div style="background-color:var(--bg-container); padding:10px; border-radius:8px; border:1px solid var(--border-visible); display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                            <span style="font-size:12px; font-weight:600;">📄 Standard výkaz (${zaznamy.length} dnů)</span>
                            <div>
                                <button class="btn-blue-small">Otevřít</button>
                                <button class="btn-danger">Smazat</button>
                            </div>
                        </div>`;

                    zaznamy.forEach(z => {
                        let isChecked = selectedIds.includes(z.id);
                        html += `
                        <div class="record-item" onclick="toggleCheck(${z.id}, event)">
                            <div class="custom-checkbox ${isChecked ? 'checked' : ''}"></div>
                            <div style="flex:1;">
                                <div style="font-weight:700; font-size:13px;">📍 ${z.datum}</div>
                                <div style="color:var(--text-muted); font-size:11px;">🕒 ${z.od} - ${z.do} | Pauza: ${z.pauzaOd}-${z.pauzaDo}</div>
                            </div>
                            <div style="text-align:right;">
                                <div class="record-hours">${z.hodiny.toFixed(2)} h</div>
                                <button class="btn-danger" style="margin-top:4px;">Smazat</button>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                }
                html += `</div></div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        /* Generování PDF podle německé šablony Tätigkeitsnachweis */
        function generatePDF(type) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(16);
            doc.text("TÄTIGKEITSNACHWEIS", 14, 20);
            
            doc.setFontSize(10);
            doc.text("Firma: ELEKTRO MICHÁLEK (IČO: 64837530)", 14, 28);
            doc.text("Kundenanschrift: ___________________________", 14, 34);

            let tableRows = zaznamy.filter(z => selectedIds.includes(z.id)).map(z => [
                z.datum, z.od, z.do, `${z.pauzaOd}-${z.pauzaDo}`, `${z.hodiny} h`, z.popis
            ]);

            doc.autoTable({
                startY: 42,
                head: [['Datum', 'von', 'bis', 'Pause', 'Gesamt', 'Tätigkeit / Popis']],
                body: tableRows,
                theme: 'grid',
                headStyles: { fillColor: [255, 149, 0], textColor: [0,0,0] }
            });

            let finalY = doc.lastAutoTable.finalY + 30;
            doc.line(14, finalY, 90, finalY);
            doc.text("Unterschrift und Stempel des Kunden", 14, finalY + 5);

            doc.line(120, finalY, 196, finalY);
            doc.text("Datum / Unterschrift Mitarbeiter", 120, finalY + 5);

            doc.save(`Stundenzettel_${type}.pdf`);
        }

        render();
    </script>
</body>
</html>
