<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stundenzettel - Výkaz hodin</title>

    <!-- PDF Knihovny pro generování tiskopisů -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --bg-main: #09090b;
            --bg-card: #18181b;
            --bg-card-sub: #202023;
            --bg-card-deep: #121215;
            --primary-orange: #ff9500;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --radius-large: 16px;
            --radius-medium: 12px;
            --radius-small: 8px;
            --danger: #ef4444;
            --info: #3b82f6;
            --success: #22c55e;
            --border-color: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        html, body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            min-height: 100vh;
        }

        .hidden { display: none !important; }

        /* Hlavní kontejner */
        #main-app {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 80px;
        }

        /* Tlačítka */
        .btn {
            background-color: var(--primary-orange);
            color: #000000;
            border: none;
            border-radius: var(--radius-large);
            padding: 14px 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { opacity: 0.8; }
        .btn-pdf {
            background-color: var(--info);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.25);
            margin-bottom: 20px;
        }
        .btn-outline { 
            background-color: transparent; 
            color: var(--text-main); 
            border: 1px solid var(--border-color); 
            margin-top: 15px; 
        }
        .btn-danger { background-color: var(--danger); color: #fff; padding: 6px 10px; font-size: 12px; border-radius: var(--radius-small); border: none; cursor: pointer; font-weight: 600; }
        .btn-small { background-color: #27272a; color: var(--text-main); padding: 6px 12px; font-size: 12px; border-radius: var(--radius-small); border: 1px solid var(--border-color); cursor: pointer; font-weight: 600; }

        /* Panel Píchaček */
        .pichačky-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-large);
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .stopwatch-display {
            font-size: 38px;
            font-weight: 800;
            color: var(--primary-orange);
            margin: 10px 0;
            font-family: monospace;
        }

        /* Karty v seznamu */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-large);
            padding: 16px;
            margin-bottom: 12px;
        }

        .month-card {
            border-left: 4px solid var(--primary-orange);
            cursor: pointer;
        }
        
        .summary-title {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .month-content {
            margin-top: 12px;
            padding-left: 10px;
            border-left: 2px solid var(--border-color);
        }

        .week-card {
            background-color: var(--bg-card-sub);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--primary-orange);
            cursor: pointer;
        }

        .week-content {
            margin-top: 12px;
            padding-left: 8px;
            border-left: 2px solid var(--border-color);
        }

        /* Záznam dne */
        .record-item {
            background-color: var(--bg-card-deep);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            padding: 12px;
            border-radius: var(--radius-medium);
        }
        
        .custom-checkbox {
            width: 22px;
            height: 22px;
            background-color: #09090b;
            border: 2px solid #3f3f46;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            color: #000;
            font-weight: bold;
        }
        .custom-checkbox.checked {
            background-color: var(--primary-orange);
            border-color: var(--primary-orange);
        }

        .record-info { flex: 1; }
        .record-time { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
        .record-desc { font-size: 13px; color: #e4e4e7; margin-top: 4px; }
        .record-hours { background-color: #27272a; color: var(--primary-orange); padding: 4px 8px; border-radius: var(--radius-small); font-weight: 700; font-size: 13px; }

        /* Modální okno */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex; justify-content: center; align-items: center;
            padding: 15px; z-index: 100;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background-color: var(--bg-card);
            width: 100%; max-width: 450px;
            border-radius: var(--radius-large);
            padding: 20px; border: 1px solid var(--border-color);
            max-height: 90vh; overflow-y: auto;
        }

        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-group { flex: 1; margin-bottom: 10px; }
        .form-group label { display: block; color: var(--text-muted); margin-bottom: 4px; font-size: 12px; font-weight: 600; }
        .form-group input, .form-group select {
            width: 100%; background-color: #09090b; border: 1px solid var(--border-color);
            color: var(--text-main); padding: 10px; border-radius: var(--radius-small);
            font-size: 14px; outline: none;
        }
        .form-group input:focus { border-color: var(--primary-orange); }
    </style>
</head>
<body>

    <div id="main-app">
        <!-- Píchačky -->
        <div class="pichačky-card">
            <div class="summary-title">Rychlé píchačky</div>
            <div id="stopwatch" class="stopwatch-display">00:00:00</div>
            <button id="pichacky-btn" class="btn" style="background-color: var(--success); color: #000;" onclick="togglePichacky()">
                🟢 Zahájit práci (Příchod)
            </button>
        </div>

        <!-- Hlavní akční tlačítko pro generování PDF -->
        <div>
            <button type="button" class="btn btn-pdf" onclick="generateRealPdf('Standard')">
                📄 Vygenerovat PDF (Tätigkeitsnachweis)
            </button>
        </div>

        <!-- Dynamický strom měsíců/týdnů/dnů -->
        <div id="tree-container"></div>

        <!-- Tlačítko ručního zápisu -->
        <button class="btn btn-outline" onclick="openManualModal()">+ Zapsat hodiny ručně</button>
    </div>

    <!-- Modální okno pro ruční zadání -->
    <div id="manual-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px; color: var(--primary-orange);">Přidat ruční záznam</h3>
            
            <div class="form-group">
                <label>Datum</label>
                <input type="date" id="m-datum">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Od</label>
                    <input type="time" id="m-od" value="07:00">
                </div>
                <div class="form-group">
                    <label>Do</label>
                    <input type="time" id="m-do" value="16:00">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Pauza Od</label>
                    <input type="time" id="m-pauza-od" value="12:00">
                </div>
                <div class="form-group">
                    <label>Pauza Do</label>
                    <input type="time" id="m-pauza-do" value="12:30">
                </div>
            </div>

            <div class="form-group">
                <label>Popis práce</label>
                <input type="text" id="m-popis" placeholder="Např. Elektroinstalace, zapojení rozvaděče...">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Hodinová sazba (€)</label>
                    <input type="number" id="m-sazba" value="25">
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn" onclick="saveManualRecord()">Uložit</button>
                <button class="btn btn-outline" style="margin: 0;" onclick="closeManualModal()">Zrušit</button>
            </div>
        </div>
    </div>

    <script>
        /* --- STAV APLIKACE --- */
        let zaznamy = JSON.parse(localStorage.getItem('stundenzettel_zaznamy')) || [
            { id: 1, datum: '2026-09-01', od: '07:00', do: '16:00', pauzaOd: '12:00', pauzaDo: '12:30', cisteHodiny: 8.5, popis: 'Montáž kabelových žlabů', sazba: 25, mena: 'EUR' },
            { id: 2, datum: '2026-09-02', od: '07:00', do: '16:00', pauzaOd: '12:00', pauzaDo: '12:30', cisteHodiny: 8.5, popis: 'Zapojení zásuvkových okruhů', sazba: 25, mena: 'EUR' },
            { id: 3, datum: '2026-09-03', od: '07:00', do: '16:00', pauzaOd: '12:00', pauzaDo: '12:30', cisteHodiny: 8.5, popis: 'Zapojení rozvaděče', sazba: 25, mena: 'EUR' }
        ];

        let selectedRecordIds = [1, 2, 3];
        let openMonths = {};
        let openWeeks = {};

        const czechMonths = ['Leden', 'Únor', 'Březen', 'Duben', 'Květen', 'Červen', 'Červenec', 'Srpen', 'Září', 'Říjen', 'Listopad', 'Prosinec'];

        /* --- POMOCNÉ FUNKCE --- */
        function saveData() {
            localStorage.setItem('stundenzettel_zaznamy', JSON.stringify(zaznamy));
            renderApp();
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            return Math.ceil((((d - yearStart) / 86400000) + 1)/7);
        }

        function toggleMonth(monthKey) {
            openMonths[monthKey] = openMonths[monthKey] === false ? true : false;
            renderApp();
        }

        function toggleWeek(weekKey, event) {
            event.stopPropagation();
            openWeeks[weekKey] = openWeeks[weekKey] === false ? true : false;
            renderApp();
        }

        function toggleRecordSelection(id, event) {
            event.stopPropagation();
            if (selectedRecordIds.includes(id)) {
                selectedRecordIds = selectedRecordIds.filter(item => item !== id);
            } else {
                selectedRecordIds.push(id);
            }
            renderApp();
        }

        function toggleSelectAllWeek(recordIds, event) {
            event.stopPropagation();
            const allChecked = recordIds.every(id => selectedRecordIds.includes(id));
            if (allChecked) {
                selectedRecordIds = selectedRecordIds.filter(id => !recordIds.includes(id));
            } else {
                recordIds.forEach(id => {
                    if (!selectedRecordIds.includes(id)) selectedRecordIds.push(id);
                });
            }
            renderApp();
        }

        function deleteRecord(id, event) {
            event.stopPropagation();
            if (confirm('Opravdu chceš smazat tento záznam?')) {
                zaznamy = zaznamy.filter(z => z.id !== id);
                selectedRecordIds = selectedRecordIds.filter(itemId => itemId !== id);
                saveData();
            }
        }

        /* --- RENDER APLIKACE --- */
        function renderApp() {
            const container = document.getElementById('tree-container');
            container.innerHTML = '';

            if (zaznamy.length === 0) {
                container.innerHTML = `<div class="card" style="text-align:center; color:var(--text-muted);">Žádné záznamy k zobrazení.</div>`;
                return;
            }

            let tree = {};

            zaznamy.forEach(z => {
                const dateObj = new Date(z.datum);
                const monthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth()).padStart(2, '0')}`;
                const monthTitle = `${czechMonths[dateObj.getMonth()]} ${dateObj.getFullYear()}`;
                
                const weekNum = getWeekNumber(dateObj);
                const weekKey = `${monthKey}-W${weekNum}`;
                const weekTitle = `${weekNum}. týden`;

                if (!tree[monthKey]) {
                    tree[monthKey] = { title: monthTitle, totalHours: 0, totalMoneyEUR: 0, weeks: {} };
                }
                if (!tree[monthKey].weeks[weekKey]) {
                    tree[monthKey].weeks[weekKey] = { title: weekTitle, totalHours: 0, totalMoneyEUR: 0, records: [] };
                }

                tree[monthKey].totalHours += z.cisteHodiny;
                tree[monthKey].weeks[weekKey].totalHours += z.cisteHodiny;

                const zarobok = z.cisteHodiny * z.sazba;
                tree[monthKey].totalMoneyEUR += zarobok;
                tree[monthKey].weeks[weekKey].totalMoneyEUR += zarobok;

                tree[monthKey].weeks[weekKey].records.push(z);
            });

            for (const [monthKey, monthData] of Object.entries(tree)) {
                const isMonthOpen = openMonths[monthKey] !== false;

                let branchHtml = `
                <div class="card month-card" onclick="toggleMonth('${monthKey}')">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div class="summary-title">Měsíční souhrn ${isMonthOpen ? '▼' : '▶'}</div>
                            <div style="font-size: 16px; font-weight: 700;">📅 ${monthData.title}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="color: var(--primary-orange); font-weight: 800;">${monthData.totalMoneyEUR.toFixed(2)} €</div>
                            <div style="color: var(--text-muted); font-size: 12px;">${monthData.totalHours.toFixed(2)} h</div>
                        </div>
                    </div>
                `;

                if (isMonthOpen) {
                    branchHtml += `<div class="month-content">`;
                    
                    for (const [weekKey, weekData] of Object.entries(monthData.weeks)) {
                        const isWeekOpen = openWeeks[weekKey] !== false;
                        const weekRecordIds = weekData.records.map(r => r.id);
                        const allWeekChecked = weekRecordIds.length > 0 && weekRecordIds.every(id => selectedRecordIds.includes(id));

                        branchHtml += `
                        <div class="card week-card" onclick="toggleWeek('${weekKey}', event)">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <div class="summary-title" style="color: var(--primary-orange);">${isWeekOpen ? '▼' : '▶'} Podrobnosti týdne</div>
                                    <div style="font-size: 14px; font-weight: 600;">📌 ${weekData.title}</div>
                                </div>
                                <div style="text-align: right;">
                                    <div style="color: var(--primary-orange); font-weight: 700;">${weekData.totalMoneyEUR.toFixed(2)} €</div>
                                    <div style="color: var(--text-muted); font-size: 12px;">${weekData.totalHours.toFixed(2)} h</div>
                                </div>
                            </div>
                        `;

                        if (isWeekOpen) {
                            branchHtml += `<div class="week-content">`;
                            
                            branchHtml += `
                            <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                                <span style="font-size: 12px; color: var(--text-muted);">Hromadná volba:</span>
                                <button class="btn-small" onclick="toggleSelectAllWeek([${weekRecordIds.join(',')}], event)">
                                    ${allWeekChecked ? '☑ Odznačit vše' : '☐ Označit celý týden'}
                                </button>
                            </div>`;

                            weekData.records.forEach(z => {
                                const d = new Date(z.datum);
                                const dateFormatted = `${d.getDate()}. ${d.getMonth() + 1}. ${d.getFullYear()}`;
                                const isChecked = selectedRecordIds.includes(z.id);

                                branchHtml += `
                                <div class="record-item" onclick="toggleRecordSelection(${z.id}, event)">
                                    <div class="custom-checkbox ${isChecked ? 'checked' : ''}">
                                        ${isChecked ? '✓' : ''}
                                    </div>
                                    <div class="record-info">
                                        <div style="font-weight: 700; font-size: 13px;">📍 ${dateFormatted}</div>
                                        <div class="record-time">🕒 ${z.od} - ${z.do} | Pauza: ${z.pauzaOd || '-'}-${z.pauzaDo || '-'}</div>
                                        ${z.popis ? `<div class="record-desc">${z.popis}</div>` : ''}
                                    </div>
                                    <div style="text-align: right;">
                                        <div class="record-hours">${z.cisteHodiny.toFixed(2)} h</div>
                                        <button class="btn-danger" style="margin-top: 6px;" onclick="deleteRecord(${z.id}, event)">Smazat</button>
                                    </div>
                                </div>
                                `;
                            });

                            branchHtml += `</div>`;
                        }

                        branchHtml += `</div>`;
                    }
                    branchHtml += `</div>`;
                }

                branchHtml += `</div>`;
                container.innerHTML += branchHtml;
            }
        }

        /* --- LOGIKA PDF --- */
        function generateRealPdf(pdfType) {
            if (selectedRecordIds.length === 0) {
                alert('Nejprve zaškrtni alespoň jeden den.');
                return;
            }

            let vybraneZaznamy = zaznamy.filter(z => selectedRecordIds.includes(z.id));
            vybraneZaznamy.sort((a, b) => new Date(a.datum) - new Date(b.datum));

            let celkemHodin = 0;
            vybraneZaznamy.forEach(z => celkemHodin += z.cisteHodiny);

            let dataProTabulku = vybraneZaznamy.map(z => {
                let d = new Date(z.datum);
                let datumFormat = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
                let pauza = (z.pauzaOd && z.pauzaDo) ? `${z.pauzaOd} - ${z.pauzaDo}` : '-';

                return [datumFormat, z.od, z.do, pauza, z.cisteHodiny.toFixed(2), z.popis || ''];
            });

            alert(`Příprava dat úspěšná!\nVybráno dnů: ${vybraneZaznamy.length}\nCelkem hodin: ${celkemHodin.toFixed(2)}\n\nV dalším kroku vykreslíme finální formulář do PDF.`);
        }

        /* --- MODÁL RUČNÍHO ZÁPISU --- */
        function openManualModal() {
            document.getElementById('m-datum').value = new Date().toISOString().split('T')[0];
            document.getElementById('manual-modal').classList.add('active');
        }

        function closeManualModal() {
            document.getElementById('manual-modal').classList.remove('active');
        }

        function saveManualRecord() {
            const datum = document.getElementById('m-datum').value;
            const od = document.getElementById('m-od').value;
            const doC = document.getElementById('m-do').value;
            const pauzaOd = document.getElementById('m-pauza-od').value;
            const pauzaDo = document.getElementById('m-pauza-do').value;
            const popis = document.getElementById('m-popis').value;
            const sazba = parseFloat(document.getElementById('m-sazba').value) || 0;

            if (!datum || !od || !doC) {
                alert('Vyplň prosím datum a čas od/do.');
                return;
            }

            // Výpočet čistých hodin
            let start = new Date(`1970-01-01T${od}:00`);
            let end = new Date(`1970-01-01T${doC}:00`);
            let diff = (end - start) / (1000 * 60 * 60);

            if (pauzaOd && pauzaDo) {
                let pStart = new Date(`1970-01-01T${pauzaOd}:00`);
                let pEnd = new Date(`1970-01-01T${pauzaDo}:00`);
                let pDiff = (pEnd - pStart) / (1000 * 60 * 60);
                if (pDiff > 0) diff -= pDiff;
            }

            const newRec = {
                id: Date.now(),
                datum,
                od,
                do: doC,
                pauzaOd,
                pauzaDo,
                cisteHodiny: diff > 0 ? diff : 0,
                popis,
                sazba,
                mena: 'EUR'
            };

            zaznamy.push(newRec);
            selectedRecordIds.push(newRec.id);
            saveData();
            closeManualModal();
        }

        // Inicializace při načtení
        renderApp();
    </script>
</body>
</html>
