<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stundenzettel App</title>
    <style>
        /* 1. Definice moderních barev a zakulacení */
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --primary-orange: #FF8C00;
            --primary-orange-hover: #FFA500;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --radius-large: 24px;
            --radius-medium: 16px;
            --radius-small: 12px;
        }

        /* 2. Reset a základní nastavení stránky */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 80px; /* Místo pro spodní menu */
        }

        /* 3. Hlavní kontejner aplikace */
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 4. Hlavička */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* 5. Karty (Měsíční souhrn, Záznamy) */
        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-large);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Souhrnná karta - oranžový akcent */
        .summary-card {
            border-left: 6px solid var(--primary-orange);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-title {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .summary-value-eur {
            color: var(--primary-orange);
            font-size: 24px;
            font-weight: bold;
            text-align: right;
        }

        /* 6. Zakulacená oranžová tlačítka */
        .btn {
            background-color: var(--primary-orange);
            color: #000;
            border: none;
            border-radius: var(--radius-large);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .btn:active {
            background-color: var(--primary-orange-hover);
        }

        /* Tlačítka pro exporty (vedle sebe) */
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn-small {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border-radius: var(--radius-medium);
            background-color: #2a2a2a;
            color: var(--text-main);
            text-align: center;
        }
        
        .btn-small.active {
            background-color: var(--primary-orange);
            color: #000;
        }

    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Pracovní hodiny</h1>
        </header>

        <!-- Horní zakulacená tlačítka -->
        <div class="button-group">
            <button class="btn btn-small active">Vše</button>
            <button class="btn btn-small">TechCo PDF</button>
            <button class="btn btn-small">Standard PDF</button>
        </div>

        <!-- Souhrnná karta -->
        <div class="card summary-card">
            <div>
                <div class="summary-title">Měsíční souhrn</div>
                <div style="font-size: 18px; font-weight: 500;">Září 2026</div>
            </div>
            <div>
                <div class="summary-value-eur" id="total-eur">0.00 €</div>
                <div style="color: var(--text-muted); text-align: right; font-size: 14px;" id="total-hours">0.00 h</div>
            </div>
        </div>

        <!-- Zde se budou generovat jednotlivé záznamy -->
        <div id="records-list">
            <!-- Ukázka jednoho prázdného zakulaceného záznamu -->
            <div class="card">
                <div style="text-align: center; color: var(--text-muted);">
                    Zatím žádné záznamy.
                </div>
            </div>
        </div>

        <!-- Hlavní tlačítko pro přidání -->
        <button class="btn" style="margin-top: 10px;" id="btn-add-record">+ Přidat nový záznam</button>
    </div>

    <script>
        // Zde budeme postupně stavět čistý JavaScript, žádné zmatky.
        console.log("Krok 1: Inicializace čisté aplikace.");
    </script>
</body>
</html>
