<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stundenzettel App</title>
    <style>
        /* Definice barev a zakulacení */
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --primary-orange: #FF8C00;
            --primary-orange-hover: #FFA500;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --radius-large: 24px;
            --radius-medium: 16px;
            --radius-small: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Nový úvod */
        header {
            margin-bottom: 30px;
            padding-top: 10px;
        }

        .greeting {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 5px;
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius-large);
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .summary-card {
            border-left: 6px solid var(--primary-orange);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .summary-title {
            color: var(--text-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .summary-value-eur {
            color: var(--primary-orange);
            font-size: 24px;
            font-weight: bold;
            text-align: right;
        }

        /* Tlačítka */
        .btn {
            background-color: var(--primary-orange);
            color: #000;
            border: none;
            border-radius: var(--radius-large);
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        .btn:active {
            background-color: var(--primary-orange-hover);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid #333;
            margin-top: 10px;
        }

        /* Záznamy v seznamu */
        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .record-time {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .record-hours {
            background-color: #2a2a2a;
            color: var(--primary-orange);
            padding: 6px 12px;
            border-radius: var(--radius-medium);
            font-weight: bold;
        }

        /* Modální okno (Formulář) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--bg-main);
            width: 100%;
            max-width: 400px;
            border-radius: var(--radius-large);
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid #333;
            color: var(--text-main);
            padding: 12px;
            border-radius: var(--radius-small);
            font-size: 16px;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: var(--primary-orange);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Osobní úvod -->
        <header>
            <h1 class="greeting">Ahoj Petře 👋</h1>
            <p class="subtitle">Tvůj přehled odpracovaných hodin</p>
        </header>

        <!-- Souhrnná karta -->
        <div class="card summary-card">
            <div>
                <div class="summary-title">Měsíční souhrn</div>
                <div style="font-size: 18px; font-weight: 500;" id="current-month-text">Září 2026</div>
            </div>
            <div>
                <div class="summary-value-eur" id="total-eur">0.00 €</div>
                <div style="color: var(--text-muted); text-align: right; font-size: 14px;" id="total-hours">0.00 h</div>
            </div>
        </div>

        <!-- Seznam záznamů -->
        <div id="records-list">
            <!-- Sem se budou generovat záznamy pomocí JS -->
        </div>

        <button class="btn" style="margin-top: 10px;" onclick="openModal()">+ Přidat nový záznam</button>
    </div>

    <!-- Modální okno pro přidání hodin -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Nový záznam</h2>
            
            <div class="form-group">
                <label>Datum</label>
                <input type="date" id="input-datum">
            </div>
            
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Od</label>
                    <input type="time" id="input-od" value="07:00">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Do</label>
                    <input type="time" id="input-do" value="16:00">
                </div>
            </div>

            <div class="form-group">
                <label>Popis (volitelné)</label>
                <input type="text" id="input-popis" placeholder="Např. tahání kabelů...">
            </div>

            <button class="btn" onclick="saveRecord()">Uložit záznam</button>
            <button class="btn btn-outline" onclick="closeModal()">Zrušit</button>
        </div>
    </div>

    <script>
        // 1. Nastavení výchozích hodnot
        const SAZBA_EUR = 25; // Tvoje hodinová sazba v eurech
        let zaznamy = JSON.parse(localStorage.getItem('nove_pracovni_zaznamy')) || [];

        // Inicializace při načtení stránky
        window.onload = () => {
            document.getElementById('input-datum').valueAsDate = new Date(); // Dnešní datum do formuláře
            renderRecords();
        };

        // 2. Obsluha modálního okna
        function openModal() {
            document.getElementById('add-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('add-modal').classList.remove('active');
        }

        // 3. Uložení nového záznamu
        function saveRecord() {
            const datum = document.getElementById('input-datum').value;
            const odCas = document.getElementById('input-od').value;
            const doCas = document.getElementById('input-do').value;
            const popis = document.getElementById('input-popis').value;

            if (!datum || !odCas || !doCas) {
                alert('Vyplň prosím datum a čas.');
                return;
            }

            // Jednoduchý výpočet hodin (bez odečtu pauzy pro začátek)
            let [h1, m1] = odCas.split(':').map(Number);
            let [h2, m2] = doCas.split(':').map(Number);
            let hodinyCiste = (h2 + m2/60) - (h1 + m1/60);
            
            if (hodinyCiste < 0) hodinyCiste = 0; // Ošetření přes půlnoc si necháme na jindy

            const novyZaznam = {
                id: Date.now(),
                datum: datum,
                od: odCas,
                do: doCas,
                hodiny: hodinyCiste,
                popis: popis
            };

            zaznamy.push(novyZaznam);
            
            // Seřazení od nejnovějšího po nejstarší
            zaznamy.sort((a, b) => new Date(b.datum) - new Date(a.datum));
            
            localStorage.setItem('nove_pracovni_zaznamy', JSON.stringify(zaznamy));
            
            closeModal();
            renderRecords();
        }

        // 4. Vykreslení seznamu a přepočet
        function renderRecords() {
            const container = document.getElementById('records-list');
            container.innerHTML = '';
            
            let celkemHodin = 0;

            if (zaznamy.length === 0) {
                container.innerHTML = `
                    <div class="card" style="text-align: center; color: var(--text-muted);">
                        Zatím nemáš žádné záznamy.
                    </div>`;
            } else {
                zaznamy.forEach(z => {
                    celkemHodin += z.hodiny;
                    
                    // Formátování data do české podoby (např. 1. 9. 2026)
                    const dateObj = new Date(z.datum);
                    const formatDatum = dateObj.toLocaleDateString('cs-CZ');

                    const html = `
                    <div class="card record-item">
                        <div>
                            <div style="font-weight: 500;">${formatDatum}</div>
                            <div class="record-time">🕒 ${z.od} - ${z.do} ${z.popis ? `| <i>${z.popis}</i>` : ''}</div>
                        </div>
                        <div class="record-hours">${z.hodiny.toFixed(2)} h</div>
                    </div>`;
                    
                    container.innerHTML += html;
                });
            }

            // Přepočet a vypsání souhrnu nahoře
            document.getElementById('total-hours').innerText = `${celkemHodin.toFixed(2)} h`;
            document.getElementById('total-eur').innerText = `${(celkemHodin * SAZBA_EUR).toFixed(2)} €`;
        }
    </script>
</body>
</html>
